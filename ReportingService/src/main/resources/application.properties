spring.application.name=reporting-service
server.port=8083
spring.datasource.url=${REPORT_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ReportDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${REPORT_DB_USER}
spring.datasource.password=${REPORT_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
app.jwt.secret=${JWT_SECRET}
app.product.url=${PRODUCT_SERVICE_URL:http://localhost:8081}
app.order.url=${ORDER_SERVICE_URL:http://localhost:8082}
