spring.application.name=BTH2-JWT
server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=BTH2_JWT;encrypt=true;trustServerCertificate=true
spring.datasource.username=${BTH2_DB_USER}
spring.datasource.password=${BTH2_DB_PASSWORD}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

app.jwt.secret=${JWT_SECRET}