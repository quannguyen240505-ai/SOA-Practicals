spring.application.name=product-management
server.port=8081

spring.datasource.url=${PRODUCT_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ProductDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${PRODUCT_DB_USER}
spring.datasource.password=${PRODUCT_DB_PASSWORD}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

app.jwt.secret=${JWT_SECRET}
